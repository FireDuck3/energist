# Щоденний імпорт публічних зарядних станцій (Open Charge Map + OpenStreetMap) у Supabase.
# Секрети: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OCM_API_KEY (Settings → Secrets and variables → Actions).
name: Sync public charging stations

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Дії прив'язані до SHA коміту, а не до тегу: тег можна перенести на інший код, а цей job має
# SUPABASE_SERVICE_ROLE_KEY. Оновлення — новий SHA з https://github.com/actions/<дія>/releases.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: node scripts/sync-stations/run.js
