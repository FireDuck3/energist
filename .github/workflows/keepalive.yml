# Безкоштовний проєкт Supabase засинає після тижня без запитів — раз на день «будимо» його.
# Ключ публічний (той самий, що в js/supabase-config.js); правила RLS не віддають жодних рядків.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          URL: https://yxbpobiipcdazwnshime.supabase.co
          KEY: sb_publishable_JD-Im8Jx4D6SZypWwMX7JQ_EIoP7uCH
        run: curl -fsS "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY"
